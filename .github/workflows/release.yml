# Releases Windmill automatically on every push to main, so installed copies can update themselves.
# - Version already bumped (by the Major/Minor/Fix prompt on a developer's PC)?  -> just tag it.
# - Not bumped (edited on github.com, by a bot, by an AI)?  -> pick the level from the commit
#   messages ("major:"/"BREAKING" = major, "feat"/"add"/"new" = minor, else fix), bump, tag.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release
        run: |
          git config user.name "windmill-release"
          git config user.email "windmill-release@users.noreply.github.com"
          python3 scripts/release.py --ci
          git push origin HEAD:main --follow-tags
          git push origin --tags

  # Build the Windows app on a real Windows machine and attach it to the release.
  app:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build Windmill.exe and WindmillSetup.exe (C# compiler built into Windows)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:winexe /optimize+ /out:dist\Windmill.exe /win32icon:gui\windmill.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Net.Http.dll launcher\Windmill.cs
          if ($LASTEXITCODE -ne 0) { throw "Windmill.exe failed to compile" }
          & $csc /nologo /target:winexe /optimize+ /out:dist\WindmillSetup.exe /win32icon:gui\windmill.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll launcher\WindmillSetup.cs
          if ($LASTEXITCODE -ne 0) { throw "WindmillSetup.exe failed to compile" }
          Get-ChildItem dist
      - name: Smoke test on Windows (install the app the way a user's PC does, start its engine)
        shell: pwsh
        run: |
          python windmill.py app --install
          if (!(Test-Path bin\Windmill.exe)) { throw "app --install did not produce bin\Windmill.exe" }
          $p = Start-Process pythonw -ArgumentList "windmill.py app --serve --port 18555 --token t" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep 1; try { $r = Invoke-WebRequest http://127.0.0.1:18555/health -UseBasicParsing; $ok = $r.StatusCode -eq 200; $r.Content } catch {} }
          if (-not $ok) { Stop-Process $p.Id -ErrorAction SilentlyContinue; throw "the app engine did not start on Windows" }
          # Run commands the way the app does (engine on pythonw -> task -> scripts it starts) and require clean output.
          $proj = Join-Path $env:RUNNER_TEMP "wm smoke proj"
          New-Item -ItemType Directory -Force $proj | Out-Null
          Set-Content (Join-Path $proj "hello.py") "print('hi')"
          $h = @{ "X-Windmill-Token" = "t" }
          foreach ($cmd in @(@("check"), @("_childtest"))) {
            $body = @{ args = $cmd; cwd = $proj } | ConvertTo-Json
            $id = (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18555/api/tasks -Headers $h -Body $body -ContentType "application/json").id
            $log = $null
            for ($i = 0; $i -lt 120; $i++) { Start-Sleep 1; $log = Invoke-RestMethod -Uri "http://127.0.0.1:18555/api/tasks/$id/log" -Headers $h; if ($null -ne $log.code) { break } }
            Write-Host "--- windmill $($cmd -join ' ') (exit $($log.code)) ---"; Write-Host $log.text
            if ($cmd[0] -eq "_childtest" -and ($log.text -notmatch "child ok" -or $log.code -ne 0)) { Stop-Process $p.Id -ErrorAction SilentlyContinue; throw "a program started from an app task couldn't print (pythonw problem)" }
            if ($log.text -match "Traceback") { Stop-Process $p.Id -ErrorAction SilentlyContinue; throw "windmill $($cmd -join ' ') crashed when run from the app" }
          }
          Stop-Process $p.Id -ErrorAction SilentlyContinue
          python windmill.py doctor
          # First-start setup, for real: the app's "Install" button runs this (silently) - it must get a working llama.cpp.
          python windmill.py install llama
          if ($LASTEXITCODE -ne 0) { throw "windmill install llama failed on a clean Windows machine" }
          python -c "import sys; sys.path.insert(0, '.'); from wm import config, heal; b = config.load().get('llama_server'); print('llama.cpp:', b, heal.probe(b)); sys.exit(0 if b and heal.probe(b)[0] == 'ok' else 1)"
          if ($LASTEXITCODE -ne 0) { throw "the installed llama.cpp doesn't run" }
      - name: Attach to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION).Trim()
          $notes = python -c "import re,sys; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'## $v.*?(?=\n## |\Z)', t, re.S); print((m.group(0) if m else 'Windmill $v') + '\n\nNew here? Download WindmillSetup.exe and run it. Already installed? Windmill updates itself.')"
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "v$v" --title "Windmill $v" --notes "$notes" }
          gh release upload "v$v" dist\WindmillSetup.exe dist\Windmill.exe --clobber

  # Build the Windmill phone app (Android) and attach it to the release. The computer serves this file to phones.
  phone:
    needs: [release, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build WindmillPhone.apk
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          code=$((100000 + $(git rev-list --count HEAD -- phone)))   # goes up only when the phone app itself changes
          gradle -p phone --no-daemon assembleDebug -PwmVersion="$v" -PphoneCode="$code"
          cp phone/app/build/outputs/apk/debug/app-debug.apk WindmillPhone.apk
          echo "$code" > WindmillPhone.code
          ls -la WindmillPhone.apk
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          gh release upload "v$v" WindmillPhone.apk WindmillPhone.code --clobber

  # Tailscale built into Windmill: the windmill-tunnel helper (tunnel/, Go + tsnet) for each kind of computer.
  tunnel:
    needs: [release, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum
      - name: Build windmill-tunnel
        working-directory: tunnel
        run: |
          set -e
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "../WindmillTunnel-$os-$arch$ext" .
          done
          ls -la ../WindmillTunnel-*
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          gh release upload "v$v" WindmillTunnel-* --clobber
