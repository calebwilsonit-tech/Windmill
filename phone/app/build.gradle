// The Windmill phone app: a window onto Windmill running on your computer (the AI never runs on the phone).
plugins { id "com.android.application" }

def wmVersion = (project.findProperty("wmVersion") ?: "0.0.0").toString()
def parts = wmVersion.tokenize(".").collect { it.isInteger() ? it.toInteger() : 0 } + [0, 0, 0]

android {
    namespace "com.windmill.phone"
    compileSdk 34
    defaultConfig {
        applicationId "com.windmill.phone"
        minSdk 26
        targetSdk 34
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName wmVersion
    }
    signingConfigs {
        // A fixed key so a newer WindmillPhone.apk installs over the old one. (Sideloaded app, not in the Play Store.)
        shared {
            storeFile file("../windmill-phone.keystore")
            storePassword "windmill-phone"
            keyAlias "windmill"
            keyPassword "windmill-phone"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
